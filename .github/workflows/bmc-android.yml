name: BMC Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack BMC project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q bmc_android_repo_root.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build Stockfish 19 for Android arm64
        working-directory: project
        run: |
          set -euo pipefail
          rm -rf third_party/stockfish
          mkdir -p third_party
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git third_party/stockfish
          make -C third_party/stockfish/src net
          make -C third_party/stockfish/src -j2 build ARCH=armv8 COMP=ndk
          make -C third_party/stockfish/src strip ARCH=armv8 COMP=ndk
          mkdir -p app/src/main/assets
          cp third_party/stockfish/src/stockfish app/src/main/assets/stockfish-arm64
          chmod 0755 app/src/main/assets/stockfish-arm64
          sha256sum app/src/main/assets/stockfish-arm64 | tee app/src/main/assets/stockfish-arm64.sha256
          file app/src/main/assets/stockfish-arm64

      - name: Verify Prior Lite archive
        working-directory: project
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import json
          with open('MODEL_DROPZONE/mobile_prior_v52_7head_mix2250.ptl.json') as f:
              print(json.load(f).get('sha256',''))
          PY
          )
          actual=$(sha256sum MODEL_DROPZONE/mobile_prior_v52_7head_mix2250.ptl | awk '{print $1}')
          test -z "$expected" || test "$expected" = "$actual"
          unzip -l MODEL_DROPZONE/mobile_prior_v52_7head_mix2250.ptl | grep -q 'bytecode.pkl'
          echo "Prior Lite archive verified"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebug

      - name: Verify APK contents
        working-directory: project
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q 'stockfish-arm64'
          unzip -l "$apk" | grep -q 'mobile_prior_v52_7head_mix2250.ptl'
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmc-android-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmc-android-reports
          path: |
            project/app/build/reports/**
            project/app/build/test-results/**
          if-no-files-found: ignore
