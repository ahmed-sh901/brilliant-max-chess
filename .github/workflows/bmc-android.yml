name: BMC Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack BMC project
        run: |
          rm -rf project
          mkdir project
          unzip -q bmc_android_repo_root.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify TorchScript Lite model archive
        working-directory: project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path('app/src/main/assets/mobile_prior_v52_7head_mix2250.ptl')
          expected=Path(str(p)+'.sha256').read_text().split()[0]
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          print('expected=', expected)
          print('actual  =', actual)
          assert expected == actual
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert any(n.endswith('/bytecode.pkl') for n in names), 'bytecode.pkl missing'
          print('TorchScript Lite archive: OK')
          PY

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android runtime smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmc-android-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmc-android-reports
          path: |
            project/app/build/reports/**
            project/app/build/test-results/**
            project/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
